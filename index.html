<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RIMA BEAT — Entrena tu freestyle</title>
<style>
  :root{
    --bg:#08061a;
    --violeta:#a855f7; --rosa:#ff3d9a; --cian:#22d3ee; --lima:#a3e635; --naranja:#ff9f43;
    --txt:#f4f1ff; --mut:#b7aede;
    --panel:rgba(255,255,255,.05); --borde:rgba(255,255,255,.12);
    --grad:linear-gradient(120deg,#a855f7,#ff3d9a 48%,#22d3ee);
    --fuente:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Mono","Consolas",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:17px/1.55 var(--fuente); min-height:100vh; overflow-x:hidden;
  }
  /* manchas de color de fondo */
  body::before{
    content:""; position:fixed; inset:-20%; z-index:-1; pointer-events:none;
    background:
      radial-gradient(38% 42% at 12% 8%,  rgba(168,85,247,.55), transparent 70%),
      radial-gradient(36% 40% at 88% 12%, rgba(255,61,154,.50), transparent 70%),
      radial-gradient(42% 46% at 78% 92%, rgba(34,211,238,.42), transparent 70%),
      radial-gradient(40% 44% at 18% 95%, rgba(163,230,53,.32), transparent 70%);
    filter:blur(20px); animation:flotar 22s ease-in-out infinite alternate;
  }
  @keyframes flotar{
    from{transform:translate3d(-2%,-1%,0) scale(1)}
    to{transform:translate3d(2%,2%,0) scale(1.08)}
  }
  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 70px}
  header{text-align:center;margin-bottom:24px}
  header h1{
    margin:0; font-size:clamp(40px,7vw,68px); letter-spacing:6px; font-weight:800;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,61,154,.45));
  }
  header p{margin:6px 0 0;color:var(--mut);letter-spacing:1px;font-size:16px}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:2.5px;color:var(--mut);margin:0 0 12px;font-weight:700}

  .card{
    background:var(--panel); border:1px solid var(--borde); border-radius:22px;
    padding:20px 22px; margin-bottom:16px; backdrop-filter:blur(14px);
    box-shadow:0 10px 40px rgba(0,0,0,.35); position:relative; overflow:hidden;
  }
  .card::after{
    content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--grad); opacity:.9;
  }
  .baseline{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .baseline b{
    font-size:26px;display:block;line-height:1.15;
    background:linear-gradient(90deg,#fff,#ffd6f0); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .baseline span{color:var(--mut);font-size:14px;font-family:var(--mono)}
  #baseTag2{color:var(--lima)!important;font-size:13px;font-family:var(--fuente)}
  #otraBase{
    margin-left:auto; border:0; border-radius:14px; padding:13px 20px; cursor:pointer;
    font-size:15px; font-weight:800; color:#12061f;
    background:linear-gradient(120deg,#ffd166,#ff9f43);
    box-shadow:0 8px 26px rgba(255,159,67,.45); transition:transform .15s, box-shadow .15s;
  }
  #otraBase:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(255,159,67,.6)}
  select{
    width:100%; margin-top:14px; background:rgba(0,0,0,.35); color:var(--txt);
    border:1px solid var(--borde); border-radius:14px; padding:12px 14px; font-size:15px; font-family:var(--fuente);
  }
  #credito{margin-top:12px;color:var(--mut);font-size:12.5px}
  #credito a{color:var(--cian)}

  .chips{display:flex;gap:9px;flex-wrap:wrap}
  .chip{
    background:rgba(255,255,255,.05); border:1px solid var(--borde); color:var(--txt);
    border-radius:999px; padding:10px 18px; cursor:pointer; font-size:15px; font-weight:600;
    transition:transform .12s, box-shadow .15s, background .15s;
  }
  .chip:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
  .chip.sel{
    color:#10061c; border-color:transparent;
    background:linear-gradient(120deg,var(--violeta),var(--rosa));
    box-shadow:0 6px 22px rgba(255,61,154,.5);
  }
  .sub{color:var(--mut);font-size:13px;margin:16px 0 9px;letter-spacing:.5px}

  .cta{
    width:100%; margin-top:6px; padding:22px; font-size:24px; font-weight:900; letter-spacing:1.5px;
    border:0; border-radius:20px; cursor:pointer; color:#10061c;
    background:linear-gradient(120deg,#a855f7,#ff3d9a 45%,#22d3ee);
    background-size:220% 100%;
    box-shadow:0 12px 44px rgba(168,85,247,.5), 0 0 0 1px rgba(255,255,255,.15) inset;
    animation:mover 6s ease infinite; transition:transform .15s;
  }
  @keyframes mover{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .cta:hover{transform:translateY(-3px) scale(1.01)}

  details{margin-top:18px;color:var(--mut);font-size:14px}
  details summary{cursor:pointer;font-weight:600}
  .fila{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .fila label{background:rgba(255,255,255,.06);border:1px dashed var(--borde);border-radius:12px;padding:11px 15px;cursor:pointer}
  #tapBtn{background:rgba(34,211,238,.15);border:1px solid var(--cian);color:var(--txt);border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:700}
  #tapInfo,#fileInfo{color:var(--lima);font-family:var(--mono)}

  /* ---- juego ---- */
  .hud{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:16px;letter-spacing:1px;font-family:var(--mono)}
  #progreso{color:var(--cian);font-weight:700}
  #grid{display:flex;flex-direction:column;gap:12px}
  .row{opacity:.32;transition:opacity .25s, transform .25s}
  .row.active{opacity:1;transform:scale(1.01)}
  .track{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .cell{background:rgba(255,255,255,.04);border:1px solid var(--borde);border-radius:16px;height:72px}
  .cell.on{
    background:linear-gradient(120deg,rgba(34,211,238,.35),rgba(168,85,247,.35));
    border-color:var(--cian); box-shadow:0 0 26px rgba(34,211,238,.55);
  }
  .cell.word{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;
    text-shadow:0 0 18px rgba(255,255,255,.35)}
  .cell.word.col-A{border-color:var(--rosa);background:linear-gradient(120deg,rgba(255,61,154,.4),rgba(168,85,247,.4));box-shadow:0 0 22px rgba(255,61,154,.4)}
  .cell.word.col-B{border-color:var(--lima);background:linear-gradient(120deg,rgba(163,230,53,.35),rgba(34,211,238,.4));box-shadow:0 0 22px rgba(163,230,53,.4)}
  .ball{position:absolute;top:7px;width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#a3e635 55%,#22d3ee);
    box-shadow:0 0 20px var(--lima),0 0 42px rgba(163,230,53,.7);transform:translateX(-50%)}
  #pista{margin-top:24px;background:var(--panel);border:1px solid var(--borde);border-radius:18px;padding:16px 18px;backdrop-filter:blur(10px)}
  #pistaLabel{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:2.5px;display:block;margin-bottom:7px}
  #pistaWords{font-weight:800;font-size:17px;background:linear-gradient(90deg,#a3e635,#22d3ee,#ff3d9a);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #stop{margin-top:18px;background:rgba(255,61,154,.12);border:1px solid var(--rosa);color:var(--txt);
    border-radius:14px;padding:12px 22px;cursor:pointer;font-weight:700}

  /* ---- resultado ---- */
  #review{text-align:center}
  #review h3{font-size:34px;margin:8px 0;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stats{display:flex;gap:16px;justify-content:center;margin:22px 0;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--borde);border-radius:18px;padding:18px 26px;min-width:130px}
  .stat b{display:block;font-size:38px;font-family:var(--mono);
    background:linear-gradient(120deg,#22d3ee,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat span{color:var(--mut);font-size:13px}
  .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btns button{padding:16px 30px;border-radius:16px;border:0;cursor:pointer;font-size:17px;font-weight:800}
  #otra{background:linear-gradient(120deg,#a855f7,#ff3d9a);color:#10061c;box-shadow:0 10px 30px rgba(255,61,154,.45)}
  #cambiar{background:rgba(255,255,255,.08);color:var(--txt);border:1px solid var(--borde)!important}

  @media (prefers-reduced-motion: reduce){
    body::before{animation:none}
    .cta{animation:none}
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RIMA BEAT</h1>
    <p>Entrena tu freestyle · di la rima justo en el beat 🎤</p>
  </header>

  <section id="setup">
    <div class="card">
      <h2>Tu base</h2>
      <div class="baseline">
        <div><b id="baseNombre">—</b><span id="baseMeta"></span> <em id="baseTag2" style="font-style:normal"></em></div>
        <button id="otraBase">🎲 Otra base</button>
      </div>
      <select id="baseSel" title="Elegir una base concreta"></select>
      <div id="credito"></div>
    </div>

    <div class="card">
      <h2>Tema de palabras</h2>
      <div id="temas" class="chips"></div>
      <div class="sub">Esquema de rima</div>
      <div id="esquemas" class="chips"></div>
      <div class="sub">Duración (compases)</div>
      <div id="duraciones" class="chips"></div>
    </div>

    <button class="cta" id="start">▶ A RIMAR</button>

    <details>
      <summary>Subir mi propia base (opcional)</summary>
      <div class="fila">
        <label>⬆ Elegir archivo<input type="file" id="fileBase" accept="audio/*" hidden></label>
        <button id="tapBtn">🥁 Marcar ritmo</button>
        <span id="tapInfo"></span><span id="fileInfo"></span>
      </div>
    </details>
  </section>

  <section id="game" hidden>
    <div class="hud"><span id="progreso">Compas 1</span><span id="baseTag"></span></div>
    <div id="grid"></div>
    <div id="pista"><span id="pistaLabel">Rima con</span><span id="pistaWords"></span></div>
    <button id="stop">◼ Parar</button>
  </section>

  <section id="review" hidden>
    <h3>¡Buen trabajo! 🔥</h3>
    <p style="color:var(--mut)">Tema <b id="rTema"></b></p>
    <div class="stats">
      <div class="stat"><b id="rCompases">0</b><span>compases</span></div>
      <div class="stat"><b id="rPalabras">0</b><span>rimas</span></div>
    </div>
    <div class="btns">
      <button id="otra">Otra vez</button>
      <button id="cambiar">Cambiar</button>
    </div>
  </section>
</div>

<script src="datos.js"></script>
<script src="bases.js"></script>
<script src="app.js"></script>
</body>
</html>
