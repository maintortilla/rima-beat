<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIMA BEAT — Entrena tu freestyle</title>
<style>
  :root{
    --bg:#0b0e14; --card:#141a24; --card2:#1b2330; --line:#26303f;
    --txt:#e8eef7; --mut:#8b9bb0; --acc:#4f8cff; --acc2:#ffb454; --ok:#3ddc97;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#16213a,var(--bg));
       color:var(--txt);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:820px;margin:0 auto;padding:22px 18px 60px}
  header{text-align:center;margin-bottom:22px}
  header h1{margin:0;font-size:38px;letter-spacing:4px;
    background:linear-gradient(90deg,var(--acc),#9d7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{margin:4px 0 0;color:var(--mut);letter-spacing:1px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:2px;color:var(--mut);margin:22px 0 10px}
  #bases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .base{text-align:left;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
  .base:hover{border-color:var(--acc)}
  .base.sel{border-color:var(--acc);background:var(--card2);box-shadow:0 0 0 1px var(--acc) inset}
  .base b{display:block;font-size:16px}
  .base span{color:var(--mut);font-size:13px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px}
  .chip.sel{background:var(--acc);border-color:var(--acc);color:#06101f;font-weight:600}
  select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:12px 14px;font-size:16px}
  .fila{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .fila label{background:var(--card);border:1px dashed var(--line);border-radius:12px;
    padding:10px 14px;cursor:pointer;color:var(--mut);font-size:14px}
  .fila label:hover{border-color:var(--acc);color:var(--txt)}
  #fileInfo{color:var(--ok);font-size:13px}
  #tapBtn{background:var(--card2);border:1px solid var(--acc);color:var(--txt);
    border-radius:12px;padding:10px 16px;cursor:pointer}
  #tapInfo{color:var(--acc2);font-weight:600}
  .cta{width:100%;margin-top:26px;padding:18px;font-size:20px;font-weight:700;letter-spacing:1px;
    border:0;border-radius:16px;cursor:pointer;color:#06101f;
    background:linear-gradient(90deg,var(--acc),#7db1ff)}
  .cta:hover{filter:brightness(1.08)}
  /* Juego */
  .hud{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:10px;letter-spacing:1px}
  #grid{display:flex;flex-direction:column;gap:10px}
  .row{opacity:.4;transition:.2s}
  .row.active{opacity:1}
  .track{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;
    height:64px;display:flex;align-items:center;justify-content:center;
    font-size:14px;color:var(--mut)}
  .cell.on{border-color:var(--acc);background:var(--card2)}
  .cell.word{font-size:22px;font-weight:700;color:var(--txt)}
  .cell.word.col-A{border-color:var(--acc);background:rgba(79,140,255,.16)}
  .cell.word.col-B{border-color:var(--acc2);background:rgba(255,180,84,.16)}
  .ball{position:absolute;top:8px;width:18px;height:18px;border-radius:50%;
    background:var(--ok);box-shadow:0 0 14px var(--ok);transform:translateX(-50%);transition:none}
  #pista{margin-top:20px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;font-size:15px}
  #pistaLabel{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:2px;display:block;margin-bottom:6px}
  #pistaWords{color:var(--acc2);font-weight:600}
  #stop{margin-top:16px;background:transparent;border:1px solid var(--line);color:var(--mut);
    border-radius:12px;padding:10px 18px;cursor:pointer}
  /* Review */
  #review{text-align:center}
  #review h3{font-size:30px;margin:10px 0}
  .stats{display:flex;gap:14px;justify-content:center;margin:20px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 22px;min-width:110px}
  .stat b{display:block;font-size:30px;color:var(--acc)}
  .stat span{color:var(--mut);font-size:13px}
  .btns{display:flex;gap:12px;justify-content:center}
  .btns button{padding:14px 24px;border-radius:12px;border:0;cursor:pointer;font-size:16px;font-weight:600}
  #otra{background:var(--acc);color:#06101f}
  #cambiar{background:var(--card);color:var(--txt);border:1px solid var(--line)!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RIMA BEAT</h1>
    <p>Entrena tu freestyle · di la rima justo en el beat</p>
  </header>

  <!-- CONFIGURACION -->
  <section id="setup">
    <h2>1 · Elige tu base</h2>
    <div id="bases"><button class="base sel"><b>Boom Bap</b><span>90 BPM · Clasico, para empezar</span></button><button class="base"><b>Chill Lo-Fi</b><span>85 BPM · Relajado, para calentar</span></button><button class="base"><b>Trap</b><span>140 BPM · Rapido, doble tiempo</span></button><button class="base"><b>Drill</b><span>142 BPM · Oscuro y deslizante</span></button></div>
    <div class="fila">
      <label>⬆ Sube tu propia base<input type="file" id="fileBase" accept="audio/*" hidden=""></label>
      <button id="tapBtn">🥁 Marcar ritmo (TAP)</button>
      <span id="tapInfo"></span>
    </div>
    <div class="fila"><span id="fileInfo"></span></div>

    <h2>2 · Tema de palabras</h2>
    <select id="tema"><option value="amor">Amor</option><option value="calle">Calle</option><option value="fiesta">Fiesta</option><option value="vida">Vida</option><option value="mente">Mente</option><option value="hampa">Hampa</option><option value="fuego">Fuego</option></select>

    <h2>3 · Esquema de rima</h2>
    <div id="esquemas" class="chips"><button class="chip sel">AABB</button><button class="chip">ABAB</button><button class="chip">AAAA</button></div>

    <h2>4 · Duracion</h2>
    <div id="duraciones" class="chips"><button class="chip sel">8 compases</button><button class="chip">16 compases</button><button class="chip">32 compases</button></div>

    <button class="cta" id="start">¡A RIMAR! 🎤</button>
  </section>

  <!-- JUEGO -->
  <section id="game" hidden="">
    <div class="hud"><span id="progreso">Compas 1</span><span id="bpmInfo"></span></div>
    <div id="grid"></div>
    <div id="pista"><span id="pistaLabel">Rima con</span><span id="pistaWords"></span></div>
    <button id="stop">◼ Parar</button>
  </section>

  <!-- RESULTADO -->
  <section id="review" hidden="">
    <h3>¡Buen trabajo! 🔥</h3>
    <p style="color:var(--mut)">Has rapeado sobre el tema <b id="rTema"></b>.</p>
    <div class="stats">
      <div class="stat"><b id="rCompases">0</b><span>compases</span></div>
      <div class="stat"><b id="rPalabras">0</b><span>rimas</span></div>
    </div>
    <div class="btns">
      <button id="otra">Otra vez</button>
      <button id="cambiar">Cambiar</button>
    </div>
  </section>
</div>

<script src="datos.js"></script>
<script src="app.js"></script>


</body></html>
