<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIMA BEAT — Entrena tu freestyle</title>
<style>
  :root{
    --bg:#0b0e14; --card:#141a24; --card2:#1b2330; --line:#26303f;
    --txt:#e8eef7; --mut:#8b9bb0; --acc:#4f8cff; --acc2:#ffb454; --ok:#3ddc97;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#16213a,var(--bg));
       color:var(--txt);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:780px;margin:0 auto;padding:22px 18px 60px}
  header{text-align:center;margin-bottom:20px}
  header h1{margin:0;font-size:40px;letter-spacing:5px;
    background:linear-gradient(90deg,var(--acc),#9d7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{margin:4px 0 0;color:var(--mut);letter-spacing:1px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--mut);margin:0 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
  .baseline{display:flex;align-items:center;gap:14px}
  .baseline b{font-size:20px;display:block}
  .baseline span{color:var(--mut);font-size:13px}
  #otraBase{margin-left:auto;background:var(--card2);border:1px solid var(--acc);color:var(--txt);
    border-radius:12px;padding:10px 14px;cursor:pointer;white-space:nowrap}
  #otraBase:hover{background:var(--acc);color:#06101f}
  select{width:100%;margin-top:12px;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:10px 12px;font-size:14px}
  #credito{margin-top:10px;color:var(--mut);font-size:12px}
  #credito a{color:var(--acc)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px}
  .chip.sel{background:var(--acc);border-color:var(--acc);color:#06101f;font-weight:600}
  .sub{color:var(--mut);font-size:13px;margin:12px 0 8px}
  .cta{width:100%;margin-top:8px;padding:20px;font-size:22px;font-weight:800;letter-spacing:1px;
    border:0;border-radius:18px;cursor:pointer;color:#06101f;
    background:linear-gradient(90deg,var(--acc),#7db1ff);box-shadow:0 8px 30px rgba(79,140,255,.25)}
  .cta:hover{filter:brightness(1.08)}
  details{margin-top:14px;color:var(--mut);font-size:13px}
  details summary{cursor:pointer}
  .fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .fila label{background:var(--card2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
  #tapBtn{background:var(--card2);border:1px solid var(--acc);color:var(--txt);border-radius:10px;padding:8px 12px;cursor:pointer}
  #tapInfo,#fileInfo{color:var(--acc2)}
  /* juego */
  .hud{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:12px;letter-spacing:1px}
  #grid{display:flex;flex-direction:column;gap:10px}
  .row{opacity:.35;transition:.2s}
  .row.active{opacity:1}
  .track{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;height:66px}
  .cell.on{border-color:var(--acc);background:var(--card2)}
  .cell.word{display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800}
  .cell.word.col-A{border-color:var(--acc);background:rgba(79,140,255,.18)}
  .cell.word.col-B{border-color:var(--acc2);background:rgba(255,180,84,.18)}
  .ball{position:absolute;top:8px;width:18px;height:18px;border-radius:50%;
    background:var(--ok);box-shadow:0 0 14px var(--ok);transform:translateX(-50%)}
  #pista{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  #pistaLabel{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:2px;display:block;margin-bottom:6px}
  #pistaWords{color:var(--acc2);font-weight:700}
  #stop{margin-top:16px;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:10px 18px;cursor:pointer}
  /* review */
  #review{text-align:center}
  #review h3{font-size:30px;margin:6px 0}
  .stats{display:flex;gap:14px;justify-content:center;margin:20px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 22px;min-width:110px}
  .stat b{display:block;font-size:30px;color:var(--acc)}
  .stat span{color:var(--mut);font-size:13px}
  .btns{display:flex;gap:12px;justify-content:center}
  .btns button{padding:14px 26px;border-radius:12px;border:0;cursor:pointer;font-size:16px;font-weight:700}
  #otra{background:var(--acc);color:#06101f}
  #cambiar{background:var(--card);color:var(--txt);border:1px solid var(--line)!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RIMA BEAT</h1>
    <p>Entrena tu freestyle · di la rima justo en el beat</p>
  </header>

  <section id="setup">
    <div class="card">
      <h2>Tu base</h2>
      <div class="baseline">
        <div><b id="baseNombre">Shiro (Kirkoid Mix)</b><span id="baseMeta">80 BPM · Kirkoid</span></div>
        <button id="otraBase">🎲 Otra base</button>
      </div>
      <select id="baseSel" title="Elegir una base concreta"><option value="080-drops-of-h2o-the-filtered-water-treatmen.mp3">Drops of H2O ( The Filtered Water Treatment ) · 80 BPM</option><option value="080-shiro-kirkoid-mix.mp3">Shiro (Kirkoid Mix) · 80 BPM</option><option value="090-i-dunno.mp3">I dunno · 90 BPM</option><option value="090-stop-blue-mix.mp3">"Stop" (blue mix) · 90 BPM</option><option value="090-space-bazooka.mp3">Space Bazooka · 90 BPM</option><option value="095-once.mp3">Once · 95 BPM</option><option value="100-urbana-metronica-wooh-yeah-mix.mp3">Urbana-Metronica (wooh-yeah mix) · 100 BPM</option><option value="100-funk-it-how-it-is-ft-alex-unreal-dm.mp3">Funk It: How It Is (ft Alex &amp; unreal_dm) · 100 BPM</option><option value="100-b-calm-violin-track.mp3">B Calm Violin Track · 100 BPM</option><option value="109-parametaphoriquement.mp3">Parametaphoriquement · 109 BPM</option><option value="115-never-heard-a-rhyme-like-this-before.mp3">Never Heard a Rhyme Like This Before · 115 BPM</option><option value="118-this-is-independence-day.mp3">This is Independence Day · 118 BPM</option><option value="120-brake-dance.mp3">Brake Dance · 120 BPM</option><option value="130-bilderbergin.mp3">Bilderbergin · 130 BPM</option><option value="140-silence-await.mp3">Silence Await · 140 BPM</option><option value="140-the-haunted-hotel.mp3">The Haunted Hotel · 140 BPM</option><option value="153-spinnin.mp3">Spinnin' · 153 BPM</option><option value="165-double-homicide.mp3">Double Homicide · 165 BPM</option></select>
      <div id="credito">Attribution (3.0) · <a href="https://ccmixter.org/content/Kirkoid/Kirkoid_-_Shiro_(Kirkoid_Mix)_1.mp3" target="_blank" rel="noopener">ccMixter</a></div>
    </div>

    <div class="card">
      <h2>Tema de palabras</h2>
      <div id="temas" class="chips"><button class="chip sel">🎲 Mezcla</button><button class="chip">Amor</button><button class="chip">Calle</button><button class="chip">Fiesta</button><button class="chip">Vida</button><button class="chip">Mente</button><button class="chip">Hampa</button><button class="chip">Fuego</button></div>
      <div class="sub">Esquema de rima</div>
      <div id="esquemas" class="chips"><button class="chip sel">AABB</button><button class="chip">ABAB</button><button class="chip">AAAA</button></div>
      <div class="sub">Duración (compases)</div>
      <div id="duraciones" class="chips"><button class="chip sel">8</button><button class="chip">16</button><button class="chip">32</button></div>
    </div>

    <button class="cta" id="start">▶ A RIMAR</button>

    <details>
      <summary>Subir mi propia base (opcional)</summary>
      <div class="fila">
        <label>⬆ Elegir archivo<input type="file" id="fileBase" accept="audio/*" hidden=""></label>
        <button id="tapBtn">🥁 Marcar ritmo</button>
        <span id="tapInfo"></span><span id="fileInfo"></span>
      </div>
    </details>
  </section>

  <section id="game" hidden="">
    <div class="hud"><span id="progreso">Compas 1</span><span id="baseTag"></span></div>
    <div id="grid"></div>
    <div id="pista"><span id="pistaLabel">Rima con</span><span id="pistaWords"></span></div>
    <button id="stop">◼ Parar</button>
  </section>

  <section id="review" hidden="">
    <h3>¡Buen trabajo! 🔥</h3>
    <p style="color:var(--mut)">Tema <b id="rTema"></b></p>
    <div class="stats">
      <div class="stat"><b id="rCompases">0</b><span>compases</span></div>
      <div class="stat"><b id="rPalabras">0</b><span>rimas</span></div>
    </div>
    <div class="btns">
      <button id="otra">Otra vez</button>
      <button id="cambiar">Cambiar</button>
    </div>
  </section>
</div>

<script src="datos.js"></script>
<script src="bases.js"></script>
<script src="app.js"></script>


</body></html>
